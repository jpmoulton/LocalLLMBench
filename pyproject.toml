[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
# The project and distribution are LocalLLMBench; the import package and the command are both `llmbench`.
name = "localllmbench"
version = "0.1.0"
description = "Tune llama.cpp serving settings for a local GGUF model and score every variation on public benchmarks"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "jpmoulton" }]
requires-python = ">=3.11"
keywords = ["llm", "llama.cpp", "gguf", "benchmark", "inference", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]
dependencies = ["pydantic>=2.10,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
eval = ["inspect-ai>=0.3,<1"]                      # the local tool-calling and retrieval fixtures
dev = ["pytest>=8,<10", "ruff>=0.9", "inspect-ai>=0.3,<1"]  # the tests exercise the real scorer, so dev implies eval

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llmbench.coding" = ["worker_image/Dockerfile", "worker_image/.dockerignore", "worker_image/polyglot-js/package.json"]
"llmbench.containers" = ["evaluator_image/*", "evaluator_image/.dockerignore", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
